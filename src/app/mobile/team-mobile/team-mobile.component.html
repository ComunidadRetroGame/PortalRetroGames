<div class="coreteam-members">
    <span class="row"><span class="col-12" *ngFor="let player of teams"
            [style]="player.RRSS!=null || player.name!=''?'display:block':'display:none'">
            <section class="rpgui-container framed " *ngIf="player.RRSS!=null || player.name!=''">

                <div class="avatar"><img width="128px" class="rpgui-container framed-golden" [alt]="player.name"
                        style="image-rendering: pixelated;"
                        [src]="player.avatar_yt==''?'/assets/img/logo.png':player.avatar_yt"></div>

                <div class="profile">
                    <h4>
                        <p class="name neon" style="color: white;">{{player.name}}</p>
                    </h4>
                    <span style="color: white;width: 100%; min-height: 300px;max-height: 300px; overflow: none;">
                        <small> {{(player.about_me||"") }} <p class="name neon title-psico" style="color: white;">...
                            </p></small>
                    </span>
                    <hr class="golden">
                    <span class="row">
                        <span *ngFor="let rrss of player.RRSS">
                            <span *ngIf="rrss.URL!=''" class="col-xs-12 col-2">

                                <a *ngIf="rrss.type!='email'" [href]="rrss.URL" target="_blank" rel="noopener"><i
                                        [class]="'nes-icon '+ (rrss.type=='other'?'coin':rrss.type)"></i></a>

                                <a *ngIf="rrss.type=='email'" [title]="rrss.URL" [href]="'mailto:' + rrss.URL"
                                    rel="noopener"><i class="nes-icon gmail"></i></a>
                            </span>
                        </span>
                    </span>
                </div>
            </section>

        </span>
    </span>
</div>
